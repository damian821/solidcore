function u(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
function show(buf){var h=new TextDecoder().decode(buf),go=function(){document.open();document.write(h);document.close()};if(document.readyState==="complete")setTimeout(go,0);else window.addEventListener("load",function(){setTimeout(go,0)})}
async function keyFrom(pw){var k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
 return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:u(S),iterations:N,hash:"SHA-256"},k,256))}
async function open_(raw){var k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
 return crypto.subtle.decrypt({name:"AES-GCM",iv:u(I)},k,u(C))}
var m=document.getElementById("m"),b=document.getElementById("b"),p=document.getElementById("p");
if(!(window.crypto&&crypto.subtle)){m.textContent="Откройте страницу по адресу, который начинается с https://";b.disabled=true}
else{(async function(){try{var s=sessionStorage.getItem("gk");if(s)show(await open_(u(s)))}catch(e){}})()}
document.getElementById("f").addEventListener("submit",async function(e){e.preventDefault();m.textContent="";b.disabled=true;
 try{var raw=await keyFrom(p.value.trim().toLowerCase());var out=await open_(raw);
  try{sessionStorage.setItem("gk",btoa(String.fromCharCode.apply(null,raw)))}catch(e){}
